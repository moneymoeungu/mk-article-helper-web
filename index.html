<title>기사 단건 문의 챗봇 (내부직원용)</title>
<style id="gate-style">
:root {
  --bg: #F7F8FA; --surface: #FFFFFF; --surface-2: #F3F4F6;
  --ink: #18181B; --muted: #71717A; --line: #E4E4E7; --line-strong: #D4D4D8;
  --brand: #EA580C; --on-brand: #FFFFFF;
  --no-fg: #DC2626; --no-bg: #FEF2F2;
  --shadow: 0 2px 6px rgba(24, 24, 27, .04), 0 12px 32px rgba(24, 24, 27, .06);
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
  font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased;
}
.gate-wrap {
  min-height: 100%; display: grid; place-items: center; padding: 24px;
}
.gate-card {
  width: 100%; max-width: 400px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 16px; padding: 28px 26px 24px;
  box-shadow: var(--shadow);
}
.gate-brand { margin-bottom: 14px; }
.gate-brand img { height: 22px; width: auto; display: block; margin-bottom: 12px; }
.gate-brand h1 { margin: 0; font-size: 17.5px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.35; }
.gate-brand h1 span { font-weight: 500; font-size: 14px; color: var(--muted); }
.gate-desc { margin: 0 0 18px; font-size: 13.5px; color: var(--muted); }
.pw-box {
  display: flex; align-items: center; border: 1px solid var(--line-strong); border-radius: 10px;
  background: var(--surface); padding: 2px 6px 2px 14px;
}
.pw-box:focus-within { border-color: var(--ink); }
.pw-box input {
  flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
  color: var(--ink); font: inherit; padding: 10px 0; font-size: 15px;
}
.pw-toggle {
  background: transparent; border: 0; color: var(--muted); font: inherit;
  font-size: 12.5px; padding: 6px 8px; border-radius: 7px; cursor: pointer;
}
.pw-toggle:hover { color: var(--ink); background: var(--surface-2); }
.gate-rem {
  display: flex; align-items: center; gap: 7px; margin: 12px 0 16px;
  font-size: 13px; color: var(--muted); cursor: pointer; user-select: none;
}
.gate-btn {
  width: 100%; border: 0; border-radius: 10px; padding: 11px 16px;
  background: var(--brand); color: var(--on-brand); font: inherit; font-weight: 700;
  font-size: 15px; cursor: pointer;
}
.gate-btn:hover:not(:disabled) { filter: brightness(0.95); }
.gate-btn:disabled { opacity: .55; cursor: wait; }
.gate-err {
  margin-top: 12px; padding: 9px 12px; border-radius: 9px;
  background: var(--no-bg); color: var(--no-fg); font-size: 13px; display: none;
}
.gate-err.show { display: block; }
</style>
</head>

  var STORE_KEY = "mk_article_helper_pw_v1";
  var form = document.getElementById("gateForm");
  var pwInput = document.getElementById("pwInput");
  var pwToggle = document.getElementById("pwToggle");
  var pwRem = document.getElementById("pwRem");
  var pwBtn = document.getElementById("pwBtn");
  var gateErr = document.getElementById("gateErr");

  function b64ToBytes(b64) {
    var bin = atob(b64), len = bin.length, out = new Uint8Array(len);
    for (var i = 0; i < len; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  async function decryptBundle(pw) {
    var enc = new TextEncoder();
    var baseKey = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
    var aesKey = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64ToBytes(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: "SHA-256" },
      baseKey,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
    var dec = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(PAYLOAD.iv) }, aesKey, b64ToBytes(PAYLOAD.ct));
    return JSON.parse(new TextDecoder().decode(dec));
  }

  function mountApp(app) {
    var gateStyle = document.getElementById("gate-style");
    var appStyle = document.createElement("style");
    appStyle.textContent = app.css;
    document.head.appendChild(appStyle);
    if (gateStyle) gateStyle.remove();

    document.body.innerHTML = app.body;

    window.__LOCK_APP__ = function () {
      try { localStorage.removeItem(STORE_KEY); sessionStorage.removeItem(STORE_KEY); } catch (e) {}
      location.reload();
    };

    var s1 = document.createElement("script");
    s1.textContent = app.dataJs;
    document.body.appendChild(s1);

    if (app.docAssetsJs) {
      var sDoc = document.createElement("script");
      sDoc.textContent = app.docAssetsJs;
      document.body.appendChild(sDoc);
    }

    if (app.xlsxB64 && window.DATA && Array.isArray(DATA.cases)) {
      var blob = new Blob([b64ToBytes(app.xlsxB64)], {
        type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
      });
      var blobUrl = URL.createObjectURL(blob);
      DATA.cases.forEach(function (c) {
        if (!c.link) return;
        [].concat(c.link).forEach(function (l) {
          if (l.href === "forms/content-purchase-form.xlsx") {
            l.href = blobUrl;
            l.download = "매일경제_콘텐츠_구매신청서.xlsx";
          }
        });
      });
    }

    if (app.manualB64) {
      var mLink = document.getElementById("manualPdfLink");
      if (mLink) {
        var mBlob = new Blob([b64ToBytes(app.manualB64)], { type: "application/pdf" });
        mLink.href = URL.createObjectURL(mBlob);
        mLink.download = "기사_단건_문의_챗봇_사용안내.pdf";
      }
    }

    var s2 = document.createElement("script");
    s2.textContent = app.appJs;
    document.body.appendChild(s2);
  }

  async function tryUnlock(pw, fromSaved) {
    gateErr.classList.remove("show");
    pwBtn.disabled = true;
    pwBtn.textContent = "확인 중...";
    try {
      var app = await decryptBundle(pw);
      try {
        if (!fromSaved) {
          if (pwRem.checked) {
            localStorage.setItem(STORE_KEY, pw);
            sessionStorage.removeItem(STORE_KEY);
          } else {
            sessionStorage.setItem(STORE_KEY, pw);
            localStorage.removeItem(STORE_KEY);
          }
        }
      } catch (e) {}
      mountApp(app);
    } catch (err) {
      if (fromSaved) {
        try { localStorage.removeItem(STORE_KEY); sessionStorage.removeItem(STORE_KEY); } catch (e) {}
      } else {
        gateErr.textContent = "비밀번호가 맞지 않아요. 다시 확인해 주세요.";
        gateErr.classList.add("show");
        pwInput.select();
      }
      pwBtn.disabled = false;
      pwBtn.textContent = "열기";
    }
  }

  pwToggle.addEventListener("click", function () {
    var show = pwInput.type === "password";
    pwInput.type = show ? "text" : "password";
    pwToggle.textContent = show ? "숨김" : "표시";
    pwInput.focus();
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var pw = pwInput.value.trim();
    if (pw) tryUnlock(pw, false);
  });

  if (!window.crypto || !window.crypto.subtle) {
    gateErr.textContent = "보안 연결(HTTPS)에서 열어 주세요.";
    gateErr.classList.add("show");
    return;
  }

  var saved = null;
  try { saved = localStorage.getItem(STORE_KEY) || sessionStorage.getItem(STORE_KEY); } catch (e) {}
